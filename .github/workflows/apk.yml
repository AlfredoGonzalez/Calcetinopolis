name: APK de prueba
# Compila un APK para instalar en tu celular y lo publica en
# Releases -> "APK de prueba" (se reemplaza en cada corrida).
# Se lanza a mano: Actions -> "APK de prueba" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      # Firmado con la llave de depuración: sirve para probar, no para Google Play.
      - name: Compilar APK
        run: flutter build apk --release
      - name: Nombrar el archivo
        run: cp build/app/outputs/flutter-apk/app-release.apk calcetinopolis-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: calcetinopolis-prueba
          path: calcetinopolis-prueba.apk
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-prueba --cleanup-tag -y || true
          gh release create apk-prueba calcetinopolis-prueba.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "APK de prueba" \
            --notes "Compilado desde ${GITHUB_SHA::7}. Modo de prueba: anuncios y compras simulados. Firmado con llave de depuración."
